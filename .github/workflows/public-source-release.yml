name: CAH source release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New version tag, for example v1.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source and reusable registries
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          from harness.skills import SkillRegistry
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              if p.suffix == '.py':
                  ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p))
              elif p.suffix == '.json':
                  json.loads(p.read_text(encoding='utf-8-sig'))
          print(SkillRegistry(Path.cwd()).validate_all())
          PY
          python -m unittest tests.test_public_export_contract
      - name: Package and publish the selected version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ARCHIVE="CAH-${RELEASE_TAG#v}.zip"
          git archive --format=zip HEAD -o "$ARCHIVE"
          unzip -t "$ARCHIVE"
          for path in README.md RELEASE_NOTES.md installation/README.md LICENSE NOTICE; do
            cmp <(git show "HEAD:$path") <(unzip -p "$ARCHIVE" "$path")
          done
          sha256sum "$ARCHIVE" > SHA256SUMS
          gh release create "$RELEASE_TAG" "$ARCHIVE" SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "CAH $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
