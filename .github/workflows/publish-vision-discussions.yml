name: Publish CAH vision discussions

on:
  push:
    branches: [main]
    paths:
      - "requests/discussions/*.json"

permissions:
  contents: write
  discussions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Publish and verify CAH vision Ideas
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          import datetime
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          owner, name = repo.split("/", 1)
          token = os.environ["GH_TOKEN"]
          endpoint = "https://api.github.com/graphql"

          paths = [
              "docs/vision/MULTI_LANE_SEMANTIC_RUNTIME.md",
              "docs/vision/EVENT_DRIVEN_SEMANTIC_SCHEDULING.md",
              "docs/vision/SHARED_NOTHING_AGENT_FABRIC.md",
              "docs/vision/CAPABILITY_CENTRIC_SCHEDULING.md",
              "docs/vision/DURABLE_SEMANTIC_MEMORY.md",
              "docs/vision/PERMISSIONLESS_AGENT_NETWORK.md",
          ]

          request_files = sorted(pathlib.Path("requests/discussions").glob("*.json"))
          latest_request = {}
          if request_files:
              latest_request = json.loads(request_files[-1].read_text(encoding="utf-8"))
          replace_titles = set(latest_request.get("replace_titles") or [])
          reply_request = latest_request.get("reply") if isinstance(latest_request.get("reply"), dict) else None

          def gql(query, variables):
              payload = json.dumps({"query": query, "variables": variables}).encode("utf-8")
              req = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "CAH-vision-discussion-publisher",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              if data.get("errors"):
                  raise RuntimeError(json.dumps(data["errors"], ensure_ascii=False))
              return data["data"]

          repo_query = """
          query($owner:String!, $name:String!) {
            repository(owner:$owner, name:$name) {
              id
              discussionCategories(first:50) { nodes { id name } }
              discussions(first:100) {
                nodes {
                  id
                  number
                  title
                  url
                  category { name }
                  author { login }
                }
              }
            }
          }
          """

          meta = gql(repo_query, {"owner": owner, "name": name})["repository"]
          categories = {x["name"].lower(): x for x in meta["discussionCategories"]["nodes"]}
          ideas = categories.get("ideas")
          if not ideas:
              raise RuntimeError("Ideas discussion category not found")

          existing_by_title = {}
          for d in meta["discussions"]["nodes"]:
              existing_by_title.setdefault(d["title"], []).append(d)

          create_mutation = """
          mutation($repo:ID!, $category:ID!, $title:String!, $body:String!) {
            createDiscussion(input:{
              repositoryId:$repo,
              categoryId:$category,
              title:$title,
              body:$body
            }) {
              discussion {
                id
                number
                title
                url
                category { name }
                author { login }
              }
            }
          }
          """

          delete_mutation = """
          mutation($id:ID!) {
            deleteDiscussion(input:{id:$id}) {
              clientMutationId
            }
          }
          """

          reply_query = """
          query($owner:String!, $name:String!, $number:Int!) {
            repository(owner:$owner, name:$name) {
              discussion(number:$number) {
                id
                number
                title
                url
                comments(first:100) {
                  nodes { id url body }
                }
              }
            }
          }
          """

          reply_mutation = """
          mutation($discussionId:ID!, $body:String!) {
            addDiscussionComment(input:{
              discussionId:$discussionId,
              body:$body
            }) {
              comment { id url body }
            }
          }
          """

          drafts = []
          seen_titles = set()

          for path in paths:
              raw = pathlib.Path(path).read_text(encoding="utf-8").strip()
              lines = raw.splitlines()
              if not lines or not lines[0].strip().startswith("# "):
                  raise RuntimeError(f"{path}: first line must be H1")
              title = lines[0].strip()[2:].strip()
              if title in seen_titles:
                  raise RuntimeError(f"duplicate source title: {title}")
              seen_titles.add(title)

              body = "\n".join(lines[1:]).strip()
              source_url = f"https://github.com/{repo}/blob/main/{path}"
              index_url = f"https://github.com/{repo}/blob/main/docs/vision/README.md"
              body = (
                  body.rstrip()
                  + "\n\n---\n\n"
                  + f"_Published automatically from the canonical public draft: [{path}]({source_url}). "
                  + f"See the [Future Architecture index]({index_url})._"
              )

              matches = existing_by_title.get(title, [])
              if len(matches) > 1:
                  raise RuntimeError(f"duplicate existing discussions for title: {title}")

              if title in replace_titles and matches:
                  gql(delete_mutation, {"id": matches[0]["id"]})
                  matches = []
                  existing_by_title[title] = []

              if matches:
                  discussion = matches[0]
                  action = "VERIFIED_EXISTING"
              else:
                  discussion = gql(
                      create_mutation,
                      {
                          "repo": meta["id"],
                          "category": ideas["id"],
                          "title": title,
                          "body": body,
                      },
                  )["createDiscussion"]["discussion"]
                  action = "RECREATED" if title in replace_titles else "CREATED"

              drafts.append({
                  "title": title,
                  "source": path,
                  "action": action,
                  "discussion": discussion,
              })

          reply_evidence = None
          if reply_request:
              number = int(reply_request.get("discussion_number") or 0)
              reply_id = str(reply_request.get("reply_id") or "").strip()
              reply_body = str(reply_request.get("body") or "").strip()
              if number < 1:
                  raise RuntimeError("reply.discussion_number must be a positive integer")
              if not reply_id:
                  raise RuntimeError("reply.reply_id is required")
              if not reply_body:
                  raise RuntimeError("reply.body is required")

              target_data = gql(
                  reply_query,
                  {"owner": owner, "name": name, "number": number},
              )["repository"]["discussion"]
              if not target_data:
                  raise RuntimeError(f"Discussion #{number} not found")

              marker = f"<!-- cah-reply-id:{reply_id} -->"
              existing_comment = next(
                  (
                      item
                      for item in target_data["comments"]["nodes"]
                      if marker in str(item.get("body") or "")
                  ),
                  None,
              )
              if existing_comment:
                  comment = existing_comment
                  reply_action = "VERIFIED_EXISTING"
              else:
                  comment = gql(
                      reply_mutation,
                      {
                          "discussionId": target_data["id"],
                          "body": reply_body.rstrip() + "\n\n" + marker,
                      },
                  )["addDiscussionComment"]["comment"]
                  reply_action = "CREATED"

              reply_evidence = {
                  "reply_id": reply_id,
                  "discussion_number": target_data["number"],
                  "discussion_title": target_data["title"],
                  "discussion_url": target_data["url"],
                  "action": reply_action,
                  "comment_id": comment["id"],
                  "comment_url": comment["url"],
              }

          # Re-query after all writes. The final evidence is based on observed GitHub state,
          # not on mutation return values alone.
          final_meta = gql(repo_query, {"owner": owner, "name": name})["repository"]
          target_titles = {x["title"] for x in drafts}
          found = [d for d in final_meta["discussions"]["nodes"] if d["title"] in target_titles]

          if len(found) != 6:
              raise RuntimeError(f"expected exactly 6 target discussions after publish, found {len(found)}")

          final_by_title = {}
          for d in found:
              if d["title"] in final_by_title:
                  raise RuntimeError(f"duplicate final discussion title: {d['title']}")
              final_by_title[d["title"]] = d

          allowed_bot_logins = {"github-actions", "github-actions[bot]"}
          results = []
          for item in drafts:
              d = final_by_title.get(item["title"])
              if not d:
                  raise RuntimeError(f"missing final discussion: {item['title']}")
              if d["category"]["name"].lower() != "ideas":
                  raise RuntimeError(f"wrong category for {item['title']}: {d['category']['name']}")
              author = (d.get("author") or {}).get("login")
              if author not in allowed_bot_logins:
                  raise RuntimeError(f"unexpected author for {item['title']}: {author}")

              results.append({
                  "title": item["title"],
                  "source": item["source"],
                  "action": item["action"],
                  "number": d["number"],
                  "url": d["url"],
                  "category": d["category"]["name"],
                  "author": author,
              })

          if len({x["url"] for x in results}) != 6:
              raise RuntimeError("target discussion URLs are not unique")

          evidence = {
              "v": 2,
              "kind": "public_vision_discussions",
              "category": "Ideas",
              "status": "PASS",
              "source": "docs/vision",
              "synced_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "workflow_run_id": os.environ["GH_RUN_ID"],
              "source_commit": os.environ["GH_SHA"],
              "discussion_count": len(results),
              "bot_authored_count": sum(1 for x in results if x["author"] in allowed_bot_logins),
              "discussions": results,
              "reply": reply_evidence,
          }

          out = pathlib.Path("evidence/public-discussions/vision.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(evidence, ensure_ascii=False, indent=2))

      - name: Persist public discussion evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/public-discussions/vision.json
          if git diff --cached --quiet; then
            echo "No evidence change."
            exit 0
          fi
          git commit -m "Record verified CAH vision discussions [skip ci]"
          python harness/git_publish.py --branch main --attempts 3 --gah-owned-workspace
