name: Semantic result finalizer
on:
  push:
    branches: [main]
    paths: ["results/*.analysis.json"]
permissions:
  contents: write
concurrency:
  group: gah-control-finalization
  cancel-in-progress: false
  queue: max
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile all durable semantic results
        run: python harness/request_drain.py --kind semantic_finalize --max-requests 100 --max-seconds 240
